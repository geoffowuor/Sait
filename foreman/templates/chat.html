{% extends '_base.html' %}
{% block title %}Foreman{% endblock %}

{% block content %}



<div class="assistant">
    <div class="ai-assistant-card">
        <h2 class="assistant-header">
            <box-icon name="brain" size="40px" color="#3498db"></box-icon>
            Foreman AI Assistant
        </h2>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chat-messages" class="chat-messages">
                <div class="message received">
                     Hello! I'm Foreman, your AI assistant. Ask me about materials, asset locations, or procurement status.
                </div>
               
            </div>

            <!-- Chat Input -->
            <form id="ai-form" class="chat-input">
                {% csrf_token %}
                <input type="text" name="query" id="query" placeholder="Ask me anything..." required>
                <button type="submit" aria-label="Send">
                    <box-icon name="send" color="#ffffff" size="24px"></box-icon>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('ai-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const query = document.getElementById('query').value.trim();
    if (!query) return;

    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
    const chatMessages = document.getElementById('chat-messages');

   
    const userMessage = document.createElement('div');
    userMessage.className = 'message sent';
    userMessage.textContent = query;
    chatMessages.appendChild(userMessage);

  
    document.getElementById('query').value = '';

    const loadingMessage = document.createElement('div');
    loadingMessage.className = 'message received';
    loadingMessage.textContent = 'Typing...';
    chatMessages.appendChild(loadingMessage);

    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Send request
    fetch('{% url "ai_assistant" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({ query })
    })
    .then(response => response.json())
    .then(data => {
    
        loadingMessage.remove();
        const aiResponse = document.createElement('div');
        aiResponse.className = 'message received';
        aiResponse.textContent = data.response;
        chatMessages.appendChild(aiResponse);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    })
    .catch(error => {
        loadingMessage.remove();
        const errorMessage = document.createElement('div');
        errorMessage.className = 'message received error';
        errorMessage.textContent = '⚠️ Something went wrong. Please try again.';
        chatMessages.appendChild(errorMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        console.error('Error:', error);
    });
});
</script>

{% endblock %}
