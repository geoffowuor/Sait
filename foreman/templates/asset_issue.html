<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issue Asset</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);}
    h2 { color: #1E3A8A; text-align: center; margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: bold; }
    input, select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    button { background: #1E3A8A; color: #fff; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0f235c; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Issue Asset</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Issue</button>
    </form>
  </div>
</body>
</html>
