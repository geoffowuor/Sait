{% extends "_base.html" %}
{% block title %}Issue Asset{% endblock title %}  

{% block content %}
  <style>
    .issue-container { 
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h2 { 
      color: #1E3A8A; 
      text-align: center; 
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 1.5rem;
    }
    form { 
      display: flex; 
      flex-direction: column; 
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }
    input, select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: #f9fafb;
      transition: all 0.2s ease-in-out;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #1E3A8A;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.1);
    }
    button {
      background: #1E3A8A;
      color: #fff;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease-in-out, transform 0.1s ease-in-out;
    }
    button:hover {
      background: #0f235c;
      transform: scale(1.02);
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      text-decoration: none;
      font-size: 14px;
      color: #2563EB;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>

  <div class="issue-container">
    <h2><i class="fas fa-share-square"></i> Issue Asset</h2>
    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="id_asset">Select Asset</label>
        {{ form.asset }}
      </div>

      <div class="form-group">
        <label for="id_quantity_issued">Quantity</label>
        {{ form.quantity_issued }}
      </div>

      <div class="form-group">
        <label for="id_issued_to">Issued To</label>
        {{ form.issued_to }}
      </div>

      <button type="submit">
        <i class="fas fa-check"></i> Issue Asset
      </button>
    </form>
    
    <a href="{% url 'asset_transactions' %}" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Transactions
    </a>
  </div>
{% endblock content %}
